services:
  - type: web
    name: gymza-saas
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        fromContext: env
      - key: REDIS_URL
        fromContext: env
      - key: JWT_ACCESS_SECRET
        fromContext: env
      - key: JWT_REFRESH_SECRET
        fromContext: env
      - key: CLIENT_ORIGIN
        value: "*" # Set this to your Vercel URL after deploy for better security, e.g., https://your-app.vercel.app
      - key: VITE_API_URL
        value: /api
